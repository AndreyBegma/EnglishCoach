# Grammar achievements. Per-topic "Mastered: <topic>" entries are generated from the syllabus
# (`data/grammar/syllabus/`), so they are not listed here.
series:
  - id: grammar_answers
    category: grammar
    metric: grammar_answers
    emoji: "✍️"
    title:
      en: "Grammar answers: {n}"
      ru: "Ответов по грамматике: {n}"
      uk: "Відповідей з граматики: {n}"
    description:
      en: "Answer {n} grammar questions"
      ru: "Ответь на вопросы по грамматике — всего {n}"
      uk: "Дай відповідь на питання з граматики — усього {n}"
    steps:
      bronze: [10, 25]
      silver: [50, 100]
      gold: [250, 500]
      platinum: [1000, 2000]
      legend: [3500, 5000]

  - id: grammar_correct
    category: grammar
    metric: grammar_correct
    emoji: "✅"
    title:
