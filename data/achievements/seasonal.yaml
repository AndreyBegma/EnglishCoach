# Seasonal achievements: sessions finished inside a dated window (learner-local, inclusive,
# MM-DD; a window may wrap the new year). The count is lifetime, so later years add to it.
series:
  - id: season_new_year
    category: seasonal
    metric: season_sessions
    season: { id: new_year, from: "12-25", to: "01-07" }
    emoji: "🎄"
    title:
      en: "Holiday learner: {n}"
      ru: "Учусь в праздники: {n}"
      uk: "Вчуся у свята: {n}"
    description:
      en: "Finish {n} sessions between 25 December and 7 January"
      ru: "Заверши занятия с 25 декабря по 7 января — всего {n}"
      uk: "Заверши заняття з 25 грудня по 7 січня — усього {n}"
    steps:
      bronze: [1]
      silver: [3]
      gold: [7]
      platinum: [14]

